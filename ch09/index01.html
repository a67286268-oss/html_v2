<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git 프로필 페이지</title>
    <style>
      :root {
        --gh-dark: #0d1117;
        --gh-card: #161b22;
        --gh-blue: #58a6ff;
        --gh-border: #30363d;
        --gh-text: #c9d1d9;

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          background-color: var(--gh-dark);
          color: var(--gh-text);
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Oxygen,
            Ubuntu,
            Cantarell,
            "Open Sans",
            "Helvetica Neue",
            sans-serif;
        }

        .gh-header {
          display: flex;
          align-items: center;
          padding: 15px 20px;
          gap: 20px;
          background-color: var(--gh-card);
          border-bottom: 1px solid var(--gh-border);
        }

        .gh-logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .gh-search {
            flex: 1;
            max-width: 400px;
            padding: 8px;
            background-color: var(--gh-dark);
            border: 1px solid var(--gh-border);
            color: white;
            border-radius: 6px;
        }
      }
    </style>
  </head>
  <body>
    <header class="gh-header">
      <span class="gh-logo">GitHub</span>
      <input class="gh-search" type="text" placeholder="Search" />
    </header>
    <main>
      <div class="profile-layout">
        <!-- 사이드 바 시작 -->
        <aside class="sidebar">
          <img
            class="avatar"
            src="https://picsum.photos/seed/ghprofile/200/200"
            alt=""
          />
          <h2>kim-coding</h2>
          <p class="username">@kim-coding</p>
          <p class="biography">풀스택 개발자를 꿈구며 매일 커밋합니다</p>
          <p><strong>42</strong> followers · <strong>18</strong> following</p>
          <div class="skills">
            <span class="skills-badge html">HTML</span>
            <span class="skills-badge css">CSS</span>
            <span class="skills-badge js">JavaScript</span>
          </div>
        </aside>
        <!-- 메인 컨텐츠 시작 -->
        <section class="main-content">
          <h3>잔디밭 (Contribution Graph)</h3>
          <div class="grass-grid">
            <!-- 라인 1  -->
            <div class="grass level-0"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
            <div class="grass level-0"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
            <!-- 라인 2 -->
            <div class="grass level-0"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
            <div class="grass level-0"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
          </div>

          <h3>저장소 (Repositories)</h3>

          <div class="repo-card">
            <h4><a href="#">html-css-clone</a></h4>
            <p>HTML/CSS 클론 코딩 프로젝트</p>
            <p class="repo-meta">
              <span class="lang-dot html-dot">*</span>
              HTML
              <span>별 112</span>
            </p>
          </div>

          <div class="repo-card">
            <h4><a href="#">todo-app</a></h4>
            <p>할 일 관리 앱</p>
            <p class="repo-meta">
              <span class="lang-dot js-dot">*</span>
              JavaScript
              <span>별 8</span>
            </p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
